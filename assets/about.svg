<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
  <foreignObject x="0" y="0" width="900" height="430">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width:900px;height:430px">
      <style>
*{box-sizing:border-box;margin:0;padding:0}
.card{width:100%;height:100%;border-radius:20px;position:relative;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 0%,#221a11 0%,#0c0a08 60%);
  border:1px solid rgba(200,165,90,.45);
  box-shadow:inset 0 0 0 6px #0c0a08,inset 0 0 0 7px rgba(200,165,90,.18);
  font-family:Georgia,'Times New Roman',serif;color:#efe6d2;padding:40px 52px}
.card::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 40%,rgba(230,207,152,.07) 50%,transparent 60%);
  background-size:250% 100%;animation:sheen 7s ease-in-out infinite}
@keyframes sheen{0%{background-position:120% 0}60%,100%{background-position:-120% 0}}
.eyebrow{font-size:11px;letter-spacing:.42em;color:#c8a55a;text-transform:uppercase;text-align:center}
.title{font-style:italic;font-size:34px;text-align:center;margin-top:10px;
  background:linear-gradient(180deg,#f3e3b8,#c8a55a 70%,#9a7a3a);-webkit-background-clip:text;background-clip:text;color:transparent}
.rule{display:flex;align-items:center;justify-content:center;gap:12px;margin:16px auto 28px;width:360px}
.rule i{flex:1;height:1px;background:linear-gradient(90deg,transparent,#c8a55a,transparent)}
.rule b{width:8px;height:8px;background:#c8a55a;transform:rotate(45deg)}
.muted{color:#a99d87}
.gold{color:#c8a55a}

.lead{font-size:15px;line-height:1.8;text-align:center;max-width:720px;margin:0 auto 14px;color:#e4dac4}
blockquote{margin:20px auto 0;max-width:640px;text-align:center;font-style:italic;font-size:15px;color:#a99d87;
  border-top:1px solid rgba(200,165,90,.2);padding-top:16px}
</style>
      <div class="card">
      <p class="eyebrow">I &#183; Introduction</p>
      <h2 class="title">About Me</h2>
      <div class="rule"><i></i><b></b><i></i></div>
      <p class="lead">My core focus is <span class="gold">security and ethical hacking</span>, but I approach learning as an
      open-ended pursuit: if something sparks my curiosity, I dig into it, regardless of field. A long-standing
      interest in philosophy shapes how I think through problems.</p>
      <p class="lead">I lean <span class="gold">generalist by design</span>. I'm drawn to leadership and enjoy directing teams
      toward a shared outcome. Before I commit to a task, I want clarity on its purpose. Once I'm in, I hold the work
      to a high standard and see it through with precision.</p>
      <blockquote>&#8220;I value autonomy over rigid structure, and bring the same energy and curiosity to whatever I take on next.&#8221;</blockquote>
    </div>
    </div>
  </foreignObject>
</svg>
