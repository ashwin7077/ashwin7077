<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <foreignObject x="0" y="0" width="900" height="400">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width:900px;height:400px">
      <style>
*{box-sizing:border-box;margin:0;padding:0}
.card{width:100%;height:100%;border-radius:20px;position:relative;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 0%,#221a11 0%,#0c0a08 60%);
  border:1px solid rgba(200,165,90,.45);
  box-shadow:inset 0 0 0 6px #0c0a08,inset 0 0 0 7px rgba(200,165,90,.18);
  font-family:Georgia,'Times New Roman',serif;color:#efe6d2;padding:40px 52px}
.card::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 40%,rgba(230,207,152,.07) 50%,transparent 60%);
  background-size:250% 100%;animation:sheen 7s ease-in-out infinite}
@keyframes sheen{0%{background-position:120% 0}60%,100%{background-position:-120% 0}}
.eyebrow{font-size:11px;letter-spacing:.42em;color:#c8a55a;text-transform:uppercase;text-align:center}
.title{font-style:italic;font-size:34px;text-align:center;margin-top:10px;
  background:linear-gradient(180deg,#f3e3b8,#c8a55a 70%,#9a7a3a);-webkit-background-clip:text;background-clip:text;color:transparent}
.rule{display:flex;align-items:center;justify-content:center;gap:12px;margin:16px auto 28px;width:360px}
.rule i{flex:1;height:1px;background:linear-gradient(90deg,transparent,#c8a55a,transparent)}
.rule b{width:8px;height:8px;background:#c8a55a;transform:rotate(45deg)}
.muted{color:#a99d87}
.gold{color:#c8a55a}

.grid{display:flex;gap:12px}
.h{flex:1;border:1px solid rgba(200,165,90,.25);border-radius:14px;padding:18px 12px 16px;text-align:center;
  background:linear-gradient(180deg,rgba(200,165,90,.07),rgba(200,165,90,0));min-height:182px}
.h .yr{font-size:11px;letter-spacing:.3em;color:#a99d87}
.h .medal{width:38px;height:38px;margin:12px auto;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(200,165,90,.6);color:#c8a55a;font-size:15px}
.h .rank{font-size:15px;font-style:italic;color:#e6cf98}
.h .ev{font-size:12.5px;line-height:1.5;color:#d9cfbb;margin-top:8px}
.h.win{background:linear-gradient(160deg,#e6cf98,#c8a55a 55%,#9a7a3a);border-color:#e6cf98;
  box-shadow:0 0 24px rgba(200,165,90,.35)}
.h.win .yr,.h.win .ev{color:#2a2118}
.h.win .rank{color:#0c0a08;font-weight:bold}
.h.win .medal{background:#0c0a08;color:#e6cf98;border-color:#0c0a08}
.foot{text-align:center;font-size:13px;color:#a99d87;margin-top:22px;font-style:italic}
</style>
      <div class="card">
      <p class="eyebrow">III &#183; Recognition</p>
      <h2 class="title">Honours &amp; Distinctions</h2>
      <div class="rule"><i></i><b></b><i></i></div>
      <div class="grid"><div class="h win">
          <p class="yr">2024</p><div class="medal">&#9733;</div>
          <p class="rank">Winner</p><p class="ev">Softwarica Hackfest</p></div><div class="h">
          <p class="yr">2025</p><div class="medal">&#9670;</div>
          <p class="rank">1st Runner Up</p><p class="ev">Pentester Nepal 12th Anniversary CTF</p></div><div class="h">
          <p class="yr">2025</p><div class="medal">&#9670;</div>
          <p class="rank">1st Runner Up</p><p class="ev">OWASP Kathmandu CTF, 0x07 Meetup</p></div><div class="h">
          <p class="yr">2025</p><div class="medal">&#9670;</div>
          <p class="rank">2nd Runner Up</p><p class="ev">Softwarica Hackfest 2.0</p></div><div class="h">
          <p class="yr">2026</p><div class="medal">&#9670;</div>
          <p class="rank">1st Runner Up</p><p class="ev">HackAstra CTF</p></div></div>
      <p class="foot"><span class="gold">5</span> podium finishes across national CTFs &amp; hackathons</p>
    </div>
    </div>
  </foreignObject>
</svg>
