<svg xmlns="http://www.w3.org/2000/svg" width="440" height="575" viewBox="0 0 440 575">
  <foreignObject x="0" y="0" width="440" height="575">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width:440px;height:575px">
      <style>
*{box-sizing:border-box;margin:0;padding:0}
.card{width:100%;height:100%;border-radius:20px;position:relative;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 0%,#221a11 0%,#0c0a08 60%);
  border:1px solid rgba(200,165,90,.45);
  box-shadow:inset 0 0 0 6px #0c0a08,inset 0 0 0 7px rgba(200,165,90,.18);
  font-family:Georgia,'Times New Roman',serif;color:#efe6d2;padding:40px 52px}
.card::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 40%,rgba(230,207,152,.07) 50%,transparent 60%);
  background-size:250% 100%;animation:sheen 7s ease-in-out infinite}
@keyframes sheen{0%{background-position:120% 0}60%,100%{background-position:-120% 0}}
.eyebrow{font-size:11px;letter-spacing:.42em;color:#c8a55a;text-transform:uppercase;text-align:center}
.title{font-style:italic;font-size:34px;text-align:center;margin-top:10px;
  background:linear-gradient(180deg,#f3e3b8,#c8a55a 70%,#9a7a3a);-webkit-background-clip:text;background-clip:text;color:transparent}
.rule{display:flex;align-items:center;justify-content:center;gap:12px;margin:16px auto 28px;width:360px}
.rule i{flex:1;height:1px;background:linear-gradient(90deg,transparent,#c8a55a,transparent)}
.rule b{width:8px;height:8px;background:#c8a55a;transform:rotate(45deg)}
.muted{color:#a99d87}
.gold{color:#c8a55a}

.card{padding:30px 30px}
.kind{font-size:10.5px;letter-spacing:.38em;text-transform:uppercase;color:#c8a55a}
.name{font-style:italic;font-size:22px;color:#efe6d2;margin:6px 0 10px}
.desc{font-size:13.5px;line-height:1.65;color:#d9cfbb}
ul{list-style:none;margin:12px 0 14px}
li{font-size:13px;line-height:1.6;color:#d9cfbb;padding-left:18px;position:relative;margin-bottom:3px}
li::before{content:'';position:absolute;left:2px;top:8px;width:6px;height:6px;background:#c8a55a;transform:rotate(45deg)}
.tags{display:flex;gap:7px}
.tag{font-size:11.5px;padding:4px 11px;border-radius:999px;border:1px solid rgba(200,165,90,.35);color:#d9cfbb}
.cta{position:absolute;left:30px;right:30px;bottom:26px;text-align:center;padding:10px;border-radius:999px;font-size:13px;
  letter-spacing:.12em;color:#0c0a08;background:linear-gradient(90deg,#9a7a3a,#e6cf98,#c8a55a);font-weight:bold}
.win{border-radius:10px;border:1px solid rgba(200,165,90,.25);background:#080706;margin-bottom:20px;overflow:hidden}
.bar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid rgba(200,165,90,.15);background:#14100c}
.bar i{width:9px;height:9px;border-radius:50%;background:#3b2f22}
.bar i:first-child{background:#c8a55a}
.bar span{font-family:Consolas,monospace;font-size:11px;color:#a99d87;margin-left:8px}
.screen{padding:12px 14px;font-family:Consolas,'Courier New',monospace;font-size:11.5px;line-height:1.65;color:#d9cfbb;height:150px}
.ok{color:#e6cf98}
.cur{display:inline-block;width:7px;height:13px;background:#c8a55a;vertical-align:middle;animation:b 1.1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
.flag{text-align:center;padding-top:14px}
.flag .big{font-style:italic;font-size:20px;color:#e6cf98;font-family:Georgia,serif}
.flag .sub{font-size:10px;letter-spacing:.3em;color:#a99d87;margin-top:6px;font-family:Georgia,serif}
.lb{display:flex;justify-content:center;gap:6px;margin-top:14px}
.lb b{width:34px;border-radius:4px 4px 0 0;background:linear-gradient(180deg,#c8a55a,rgba(200,165,90,.15))}
</style>
      <div class="card">
      <div class="win"><div class="bar"><i></i><i></i><i></i><span>ctf.aswinpaudel.com.np</span></div>
        <div class="screen flag"><p class="big">Attack On Hash Function</p><p class="sub">CAPTURE THE FLAG</p>
        <div class="lb"><b style="height:34px"></b><b style="height:52px"></b><b style="height:24px"></b></div></div></div>
      <p class="kind">Web Platform</p>
      <p class="name">CTF Portal</p>
      <p class="desc">A capture-the-flag competition portal, hand-built with vanilla web technologies.</p>
      <ul><li>Cryptography, reverse engineering &amp; exploit challenges</li><li>Flag submission and a global leaderboard</li>
        <li>Community hub with a Discord server for players</li></ul>
      <div class="tags"><span class="tag">HTML</span><span class="tag">CSS</span><span class="tag">JavaScript</span></div>
      <div class="cta">VISIT LIVE DEMO &#8599;</div>
    </div>
    </div>
  </foreignObject>
</svg>
