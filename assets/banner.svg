<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Aswin Paudel — Cybersecurity &amp; Ethical Hacking">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6cf98"/>
      <stop offset=".5" stop-color="#c8a55a"/>
      <stop offset="1" stop-color="#9a7a3a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".45" r=".6">
      <stop offset="0" stop-color="#2a2118" stop-opacity=".9"/>
      <stop offset="1" stop-color="#0c0a08" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#c8a55a" stroke-opacity=".05"/>
    </pattern>
    <style>
      .serif { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; }
      .body  { font-family: Merriweather, Georgia, serif; }
      .mono  { font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace; }
      .fade  { opacity: 0; animation: in 1.2s ease forwards; }
      .d1 { animation-delay: .2s } .d2 { animation-delay: .6s } .d3 { animation-delay: 1s } .d4 { animation-delay: 1.4s }
      @keyframes in { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
    </style>
  </defs>

  <rect width="1200" height="340" fill="#0c0a08"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>

  <!-- double gilt frame -->
  <rect x="14" y="14" width="1172" height="312" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
  <rect x="22" y="22" width="1156" height="296" fill="none" stroke="#c8a55a" stroke-opacity=".35"/>
  <g fill="#c8a55a">
    <path d="M14 14h22v2H16v20h-2z"/><path d="M1186 14h-22v2h20v20h2z"/>
    <path d="M14 326h22v-2H16v-20h-2z"/><path d="M1186 326h-22v-2h20v-20h2z"/>
  </g>

  <!-- monogram -->
  <g class="fade d1">
    <circle cx="600" cy="72" r="28" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
    <circle cx="600" cy="72" r="23" fill="none" stroke="#c8a55a" stroke-opacity=".4"/>
    <text x="600" y="81" text-anchor="middle" class="serif" font-style="italic" font-size="24" fill="url(#gold)">AP</text>
  </g>

  <text x="600" y="160" text-anchor="middle" class="serif fade d2" font-size="62" font-style="italic" fill="#efe6d2" letter-spacing="1">Aswin Paudel</text>

  <g class="fade d3">
    <line x1="420" y1="186" x2="560" y2="186" stroke="url(#gold)"/>
    <path d="M600 180l6 6-6 6-6-6z" fill="#c8a55a"/>
    <line x1="640" y1="186" x2="780" y2="186" stroke="url(#gold)"/>
    <text x="600" y="224" text-anchor="middle" class="body" font-size="15" fill="#c8a55a" letter-spacing="5">CYBERSECURITY · ETHICAL HACKING · DIGITAL FORENSICS · DATA</text>
  </g>

  <g class="fade d4">
    <text x="600" y="270" text-anchor="middle" class="body" font-size="15" font-style="italic" fill="#a99d87">“A jack of all trades is a master of none, but oftentimes better than a master of one.”</text>
    <text x="600" y="302" text-anchor="middle" class="mono" font-size="12" fill="#9a7a3a">root@aswinpaudel:~$ whoami<tspan class="cursor" fill="#c8a55a"> ▍</tspan></text>
  </g>
</svg>
