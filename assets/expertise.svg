<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
  <foreignObject x="0" y="0" width="900" height="430">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width:900px;height:430px">
      <style>
*{box-sizing:border-box;margin:0;padding:0}
.card{width:100%;height:100%;border-radius:20px;position:relative;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 0%,#221a11 0%,#0c0a08 60%);
  border:1px solid rgba(200,165,90,.45);
  box-shadow:inset 0 0 0 6px #0c0a08,inset 0 0 0 7px rgba(200,165,90,.18);
  font-family:Georgia,'Times New Roman',serif;color:#efe6d2;padding:40px 52px}
.card::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 40%,rgba(230,207,152,.07) 50%,transparent 60%);
  background-size:250% 100%;animation:sheen 7s ease-in-out infinite}
@keyframes sheen{0%{background-position:120% 0}60%,100%{background-position:-120% 0}}
.eyebrow{font-size:11px;letter-spacing:.42em;color:#c8a55a;text-transform:uppercase;text-align:center}
.title{font-style:italic;font-size:34px;text-align:center;margin-top:10px;
  background:linear-gradient(180deg,#f3e3b8,#c8a55a 70%,#9a7a3a);-webkit-background-clip:text;background-clip:text;color:transparent}
.rule{display:flex;align-items:center;justify-content:center;gap:12px;margin:16px auto 28px;width:360px}
.rule i{flex:1;height:1px;background:linear-gradient(90deg,transparent,#c8a55a,transparent)}
.rule b{width:8px;height:8px;background:#c8a55a;transform:rotate(45deg)}
.muted{color:#a99d87}
.gold{color:#c8a55a}

.cols{display:flex;gap:22px}
.col{flex:1;border:1px solid rgba(200,165,90,.22);border-radius:14px;padding:20px 18px;background:rgba(200,165,90,.03)}
.label{font-size:10.5px;letter-spacing:.38em;text-transform:uppercase;color:#c8a55a;text-align:center;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.chip{font-size:13.5px;padding:7px 15px;border-radius:999px;border:1px solid rgba(200,165,90,.38);
  background:linear-gradient(180deg,rgba(200,165,90,.1),rgba(200,165,90,.02));color:#efe6d2}
.chip.small{font-size:12.5px;padding:5px 14px;color:#d9cfbb}
</style>
      <div class="card">
      <p class="eyebrow">II &#183; Capabilities</p>
      <h2 class="title">Expertise</h2>
      <div class="rule"><i></i><b></b><i></i></div>
      <div class="cols">
        <div class="col"><p class="label">Technical</p><div class="chips"><span class="chip">Linux</span><span class="chip">Digital Forensics</span><span class="chip">Web Penetration Testing</span><span class="chip">Data Analysis</span><span class="chip">LLM Security</span><span class="chip">Capture the Flag</span></div></div>
        <div class="col"><p class="label">Personal</p><div class="chips"><span class="chip">Executive-Level Briefing</span><span class="chip">Cross-Disciplinary Collaboration</span><span class="chip">Adversarial Thinking</span><span class="chip">Initiative Ownership</span></div></div>
      </div>
      <p class="label" style="margin-top:26px">Working Stack</p>
      <div class="chips center"><span class="chip small">Python</span><span class="chip small">Volatility</span><span class="chip small">Bash</span><span class="chip small">HTML</span><span class="chip small">CSS</span><span class="chip small">JavaScript</span><span class="chip small">Firebase</span></div>
    </div>
    </div>
  </foreignObject>
</svg>
